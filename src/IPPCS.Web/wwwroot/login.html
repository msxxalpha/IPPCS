<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود به IPPCS</title><link rel="stylesheet" href="/css/production.css">
<style>.login-frame{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#eaf0f5,#d9e5ef)}.login-card{width:min(440px,100%);background:#fff;border-radius:20px;box-shadow:0 18px 48px #17324d20;padding:30px;border:1px solid #dee5ea}.login-card h1{font-size:23px;color:#17324d}.login-card form{display:grid;gap:16px}.login-card .btn-main{width:100%}.login-card p{color:#62798c;line-height:1.9;font-size:12px}</style>
<script defer src="/js/login.js"></script>
</head>
<body><main class="login-frame"><div class="login-card">
<div class="brand"><div class="brand-logo">IP</div><div><strong style="color:#17324d">ایندامین سایپا</strong><small>برنامه‌ریزی و کنترل جامع تولید</small></div></div>
<h1>ورود به سامانه IPPCS</h1><p>ورود محلی و مستقل، بدون اتصال به ماژول منابع انسانی. نام کاربری اولیه باید توسط مدیر فنی در تنظیمات امن محیط توسعه ایجاد شود.</p>
<form id="login-form"><label>نام کاربری<input name="username" autocomplete="username" required maxlength="120"></label>
<label>رمز عبور<input type="password" name="password" autocomplete="current-password" required></label>
<div class="notice error" id="login-error" hidden role="alert"></div>
<button type="submit" class="btn-main">ورود امن</button></form>
<p>نسخه اولیه توسعه: برای ایجاد مدیر اولیه به راهنمای <code>docs/DEVELOPER_GUIDE.md</code> مراجعه کنید.</p>
</div></main></body></html>
