<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPPCS | تخصیص MPS</title><link rel="stylesheet" href="/css/production.css"><script defer src="/js/security-client.js"></script><script defer src="/js/mps-pegging.js"></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-logo">IP</div><div><strong>ایندامین سایپا</strong><small>کنترل برنامه و اجرا</small></div></div><nav><a class="planning-link" href="/app.html">داشبورد</a><a class="planning-link" href="/planning.html">برنامه MPS</a><a class="planning-link" href="/execution.html">دستورات ساخت</a></nav></aside><div class="main"><header class="topbar"><div><div class="eyebrow">برنامه‌ریزی و کنترل تولید</div><h1>تخصیص دستور ساخت به MPS</h1></div><button class="btn-outline" data-ip-logout>خروج</button></header><main class="content"><div class="callout">تخصیص مقدار به نسخه مصوب MPS با کنترل عدم تجاوز از مقدار برنامه و ظرفیت دستور، مستقل از انبار، خرید و فروش.</div><div id="feedback" class="notice" hidden role="status"></div><form id="peg-form" class="panel form-grid"><label>نسخه MPS<select name="version" id="peg-version" required></select></label><label>ردیف MPS<select name="line" id="peg-line" required></select></label><label>دستور ساخت<select name="order" id="peg-order" required></select></label><label>مقدار تخصیص<input name="quantity" type="number" min="0.0001" step="any" required></label><div class="form-actions"><button type="submit" class="btn-main">ثبت ارتباط برنامه و دستور</button></div></form><div class="panel"><h3>تحقق ردیف‌های برنامه مصوب</h3><div id="peg-summary"></div></div></main></div></div></body></html>
